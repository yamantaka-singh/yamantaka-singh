name: Generate Snake Animation
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yamantaka-singh
          outputs: |
            dist/github-snake.svg?color_snake=#800020&color_dots=#ebedf0,#f3d2d8,#de8594,#a83244,#800020
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#E06C7E&color_dots=#161b22,#3d1720,#6e1c2e,#9e263d,#e06c7e
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
