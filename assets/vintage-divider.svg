<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40" fill="none">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0"/>
      <stop offset="15%" stop-color="#800020" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#C5A059" stop-opacity="1"/>
      <stop offset="85%" stop-color="#800020" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#C5A059" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800020"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#800020"/>
    </linearGradient>
  </defs>

  <!-- Central ornamental diamond & flourish -->
  <g transform="translate(400, 20)">
    <!-- Central Diamond -->
    <path d="M0 -10 L10 0 L0 10 L-10 0 Z" fill="url(#goldGrad)" stroke="#E06C7E" stroke-width="0.8"/>
    <circle cx="0" cy="0" r="3" fill="#800020"/>

    <!-- Small flank beads -->
    <circle cx="-22" cy="0" r="2.5" fill="#C5A059"/>
    <circle cx="22" cy="0" r="2.5" fill="#C5A059"/>
    <circle cx="-34" cy="0" r="1.5" fill="#800020"/>
    <circle cx="34" cy="0" r="1.5" fill="#800020"/>

    <!-- Flourish scrolls left -->
    <path d="M-10 0 C-15 -6, -25 -6, -30 0 C-35 6, -42 4, -48 0" stroke="#C5A059" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M-12 2 C-20 7, -28 5, -34 0" stroke="#800020" stroke-width="0.9" stroke-linecap="round" fill="none"/>

    <!-- Flourish scrolls right -->
    <path d="M10 0 C15 -6, 25 -6, 30 0 C35 6, 42 4, 48 0" stroke="#C5A059" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M12 2 C20 7, 28 5, 34 0" stroke="#800020" stroke-width="0.9" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Horizontal divider lines with gradient fade -->
  <line x1="50" y1="20" x2="340" y2="20" stroke="url(#maroonGrad)" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="460" y1="20" x2="750" y2="20" stroke="url(#maroonGrad)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
